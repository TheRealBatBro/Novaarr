services:
  novaarr:
    build: .
    container_name: novaarr
    restart: unless-stopped
    # Extra container hardening: the image already runs as a non-root user (see Dockerfile) —
    # these deny it anything beyond that even if a dependency were ever compromised. read_only
    # means the whole filesystem except /data and /tmp (below) is immutable; the app never
    # writes anywhere else (SQLite lives in /data, uploads are handled in memory).
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "3210:3000"           # remove/change if using a reverse proxy
    volumes:
      - novaarr-data:/data    # SQLite database (your PIN + service configs) persists here
    environment:
      NODE_ENV: production
      PORT: 3000
      # Set to a sub-path if hosting at e.g. https://myserver.local/novaarr
      # Leave empty ("") to serve from root
      BASE_PATH: ""
      DB_PATH: /data/novaarr.db
      # true: menu shows every known service regardless of enabled state (handy while you're
      #   still setting things up). false: menu only shows services you've enabled in Settings.
      # Flip to "false" once you're done configuring and want the tidied-up production menu.
      SHOW_ALL_SERVICES: "true"
      # DANGER: skips the sign-in lock (PIN/password or multi-user login) entirely. Leave unset
      # in any deployment reachable by more than just you — only for local backend hacking.
      # DISABLE_AUTH: "true"
      # Optional: shown as the clickable link in Settings > Security's Cloudflare Tunnel status
      # card once you've set up the cloudflared sidecar below. Purely cosmetic — the app has no
      # way to read this back from Cloudflare itself, so it's just what you tell it.
      # CLOUDFLARE_TUNNEL_HOSTNAME: "novaarr.example.com"
      # Optional: enables signing in via Cloudflare Access instead of (or alongside) the app's
      # own PIN/password/2FA — Cloudflare's own login becomes the auth boundary for anyone
      # reaching Novaarr through this Access application. Both must be set together. See
      # "Cloudflare Access" in README.md for the one-time setup on Cloudflare's side and how to
      # link an email to a specific user in multi-user mode.
      # CF_ACCESS_TEAM_DOMAIN: "yourteam.cloudflareaccess.com"
      # CF_ACCESS_AUD: "the-access-application-aud-tag"
      # Optional: shown as the clickable link in Settings > Security's Tailscale status card once
      # you've set up the tailscale sidecar below. Purely cosmetic, same as the Cloudflare one —
      # if the sidecar's own status reports a DNSName, that takes priority over this instead.
      # TAILSCALE_HOSTNAME: "novaarr.your-tailnet.ts.net"
    # Uncomment to expose only to a local reverse proxy (Nginx/Traefik/Caddy)
    # and remove the `ports` section above:
    # networks:
    #   - proxy

  # Optional: exposes Novaarr to the internet through a Cloudflare Tunnel instead of port-
  # forwarding or a separate reverse proxy. Setup (one-time, on Cloudflare's side):
  #   1. one.dash.cloudflare.com > Zero Trust > Networks > Tunnels > Create a tunnel
  #   2. Add a public hostname pointing at http://novaarr:3000 (this container, by its
  #      Compose service name — reachable from cloudflared over the shared Compose network)
  #   3. Copy the tunnel token from the install step and paste it below
  # Uncomment this whole block, set CLOUDFLARE_TUNNEL_HOSTNAME above to match step 2, and
  # Settings > Security will show the tunnel's live connection status.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: novaarr-cloudflared
  #   restart: unless-stopped
  #   # --metrics on 0.0.0.0 (not the image's 127.0.0.1 default) so the novaarr container can
  #   # reach /ready across the Compose network to report status — never exposed outside it.
  #   command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token YOUR_TUNNEL_TOKEN_HERE

  # Optional: makes Novaarr reachable on your private Tailscale network (a mesh VPN) instead of,
  # or alongside, a public Cloudflare Tunnel — no port-forwarding, no public exposure at all if
  # that's all you use. Setup (one-time, on Tailscale's side):
  #   1. login.tailscale.com/admin/settings/keys > Generate an auth key (reusable, and consider
  #      an expiry/tag so it doesn't need regenerating by hand every 90 days)
  #   2. Paste it in for TS_AUTHKEY below
  # Uncomment this whole block and Settings > Security will show the tailnet's live connection
  # status. `network_mode: service:novaarr` is what actually makes the novaarr container itself
  # reachable at the tailnet hostname/IP — this sidecar shares its network namespace rather than
  # getting one of its own, which is also what lets novaarr reach tailscaled's local status API
  # over localhost for that status card (TS_LOCAL_ADDR_PORT below exposes it).
  # tailscale:
  #   image: tailscale/tailscale:latest
  #   container_name: novaarr-tailscale
  #   hostname: novaarr
  #   restart: unless-stopped
  #   network_mode: service:novaarr
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_RAW
  #   volumes:
  #     - novaarr-tailscale-state:/var/lib/tailscale
  #   environment:
  #     TS_AUTHKEY: "YOUR_TAILSCALE_AUTH_KEY_HERE"
  #     TS_STATE_DIR: /var/lib/tailscale
  #     TS_LOCAL_ADDR_PORT: "0.0.0.0:41112"

volumes:
  novaarr-data:
  # novaarr-tailscale-state:

