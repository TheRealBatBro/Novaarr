<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Anchors every relative URL on the page (asset src/href, fetch(), anchors) to the app's
         actual mount point, not the current document's path depth — without this, reloading a
         deep route like /remotarr/settings/services would resolve "./assets/x.js" against
         "/remotarr/settings/" instead of "/remotarr/". Server-templated, see server.js. -->
    <base href="__BASE_HREF__" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Remotarr</title>
    <meta name="description" content="A self-hosted remote control dashboard for your media and download stack." />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Remotarr" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__BASE_PATH__ = '__BASE__';
      window.__SHOW_ALL_SERVICES__ = __SHOW_ALL_SERVICES_VALUE__;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
