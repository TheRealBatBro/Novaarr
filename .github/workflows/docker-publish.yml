name: Publish Docker image

# Ordinary pushes to main publish to :development only — safe to land continuously
# without touching what anyone's actually running. :latest (production) only updates
# when a version tag (v1.2.3) is pushed, so a release is a deliberate, separate step.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="therealbatbro/remotarr:latest,therealbatbro/remotarr:${VERSION}"
          else
            TAGS="therealbatbro/remotarr:development"
          fi
          TAGS="${TAGS},therealbatbro/remotarr:${GITHUB_SHA}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Plain single-manifest image — a provenance/SBOM attestation entry (tagged
          # platform: unknown/unknown) breaks pulls on older Docker Engines and several
          # NAS/Docker-UI tools (Unraid, Synology, Portainer, Watchtower) with "manifest
          # unknown", even though the tag exists and pulls fine on an up-to-date Docker CLI.
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: therealbatbro/remotarr
          readme-filepath: ./DOCKERHUB.md
          short-description: Self-hosted web dashboard for Sonarr, Radarr, Plex, and more
