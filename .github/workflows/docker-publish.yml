name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Plain single-manifest image — a provenance/SBOM attestation entry (tagged
          # platform: unknown/unknown) breaks pulls on older Docker Engines and several
          # NAS/Docker-UI tools (Unraid, Synology, Portainer, Watchtower) with "manifest
          # unknown", even though the tag exists and pulls fine on an up-to-date Docker CLI.
          provenance: false
          sbom: false
          tags: |
            therealbatbro/remotarr:latest
            therealbatbro/remotarr:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: therealbatbro/remotarr
          readme-filepath: ./DOCKERHUB.md
          short-description: Self-hosted NZB360-style web dashboard for Sonarr, Radarr, Plex, and more
